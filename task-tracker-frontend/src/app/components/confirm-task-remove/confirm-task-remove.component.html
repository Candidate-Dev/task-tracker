<div class="bg-white rounded-md p-10 w-lg flex flex-col gap-10 shadow-sm shadow-gray-500">
    <h1 class="font-semibold text-center">Are you sure you want to delete this task?</h1>
    <div class="buttons-container flex justify-end gap-3">
        <button (click)="closeDialog()" class="px-4 py-2 border-2 border-indigo-500 font-semibold text-indigo-500 rounded-md hover:cursor-pointer hover:border-indigo-700 hover:text-indigo-700">Cancel</button>
        <button (click)="removeTask()" class="bg-red-600 text-white font-semibold px-4 py-2 rounded-md hover:cursor-pointer hover:bg-red-800">Delete</button>
    </div>
</div>
