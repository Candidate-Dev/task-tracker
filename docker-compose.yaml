services:
  db:
    image: postgres
    container_name: task-tracker-database
    environment:
      POSTGRES_DB: task-tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql

  backend:
    build: ./task-tracker-backend

    container_name: task-tracker-backend
    ports:
      - "3000:3000"
    
    environment:
      DB_HOST: db
      DB_NAME: task-tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
    
    depends_on:
      - db

    volumes:
      - ./task-tracker-backend:/app
      - /app/node_modules

  frontend:
    build: ./task-tracker-frontend

    container_name: task-tracker-frontend

    ports:
      - "4200:4200"

    depends_on:
      - backend

    volumes:
      - ./task-tracker-frontend:/app
      - /app/node_modules

volumes:
  postgres_data: